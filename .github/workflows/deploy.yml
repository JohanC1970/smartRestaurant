name: Build & Deploy to EC2

on:
  push:
    branches: [ deployment ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (con tests)
        run: ./mvnw clean package

      - name: Copiar JAR a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/smartRestaurant-0.0.1-SNAPSHOT.jar"
          target: "/home/${{ secrets.EC2_USER }}/app/"
          strip_components: 1

      - name: Reiniciar aplicación en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            pkill -f java || true
            sleep 2
            nohup java -jar /home/${{ secrets.EC2_USER }}/app/smartRestaurant-0.0.1-SNAPSHOT.jar \
              > /home/${{ secrets.EC2_USER }}/app/app.log 2>&1 &
            echo "Aplicación iniciada con PID $!"
