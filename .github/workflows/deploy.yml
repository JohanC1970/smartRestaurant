name: Build & Deploy to EC2

on:
  push:
    branches: [ deployment ]
  pull_request:
    branches:
      - main
      - deployment

jobs:
  sonarqube:
    name: SonarQube Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # importante para historial completo

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven

      # 3. Ejecutar tests y generar cobertura
      - name: Run tests and generate coverage
        run: mvn clean verify -DskipITs

      # 4. Analizar con SonarQube
      - name: SonarQube Scan
        run: |
          mvn clean install sonar:sonar \
            -Dsonar.projectKey=smartRestaurant \
            -Dsonar.organization=Samuel Castaño
            -Dsonar.sources=src/main \
            -Dsonar.tests=src/test \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 5. Comentar en el PR (opcional)
      - name: Comment PR with SonarQube Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ' SonarQube analysis completed. Check the results in [SonarQube Dashboard](${{ secrets.SONAR_HOST_URL }}).'
            })

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (con tests)
        run: ./mvnw clean package

      - name: Copiar JAR a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/smartRestaurant-0.0.1-SNAPSHOT.jar"
          target: "/home/${{ secrets.EC2_USER }}/app/"
          strip_components: 1

      - name: Reiniciar aplicación en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            grep '^export ' ~/.bashrc | sed 's/^export //' > ~/app/.env
            sudo systemctl restart smartrestaurant
